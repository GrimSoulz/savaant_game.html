<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Savaant</title>
    <style>
        body {
            background-color: #121417;
            color: #f5f6fa;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }
        #setup-screen {
            background: #1a1d23;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2f3640;
        }
        .btn {
            background-color: #353b48;
            color: white;
            border: 1px solid #2f3640;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            display: block;
            width: 220px;
        }
        .btn:active {
            background-color: #00a8ff;
        }
        #game-container {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Choose Your Faction</h2>
        <button class="btn" id="pick-lumin">Play as Lumin</button>
        <button class="btn" id="pick-nox">Play as Nox</button>
    </div>

    <div id="game-container">
        <h2 id="current-status">Game Started!</h2>
        <p>If you can see this, faction selection worked.</p>
    </div>

    <script>
        // Using 'pointerdown' instead of 'click' for immediate mobile tablet response
        document.getElementById('pick-lumin').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame('Lumin');
        });

        document.getElementById('pick-nox').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startGame('Nox');
        });

        function startGame(faction) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('current-status').textContent = `Playing as ${faction}`;
        }
    </script>
</body>
</html>
